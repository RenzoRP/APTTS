<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Exercise - APTT</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 8px;
    }
    label {
      font-weight: bold;
    }
    input, select, textarea {
      padding: 0.5rem;
      border-radius: 4px;
      border: none;
      width: 100%;
    }
    textarea {
      resize: vertical;
    }
    .test-case-box {
      margin-bottom: 1rem;
    }
    .test-case-box textarea {
      font-family: monospace;
    }
    .hint {
      font-size: 0.9rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 1rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <img src="assets/APTT_Logo.png" alt="APTT Logo" class="logo" onclick="window.location.href='dashboard.html'" />
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main class="container">
    <h2>Create New Exercise</h2>
    <form id="exercise-form">
      <label>Title</label>
      <input type="text" name="title" required />

      <label>Description</label>
      <textarea name="description" rows="4" required></textarea>

      <label>Difficulty</label>
      <select name="difficulty" required>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label>Collection</label>
      <select name="collection" id="collection-select">
        <option value="">-- None --</option>
      </select>

      <label>Print-based Evaluation</label>
      <input type="checkbox" name="print_based" />

      <label>Optimal Solution (Python)</label>
      <textarea name="optimal_solution" rows="6" required></textarea>

      <label>Test Cases</label>
      <div class="hint">
        Each test case must be a JSON object with <code>input</code> and <code>expected_output</code> keys.<br/>
        Examples:<br/>
        <code>{"input": [3, 5], "expected_output": 8}</code><br/>
        <code>{"input": [[1, 2, 3]], "expected_output": 6}</code><br/>
        <code>{"input": [], "expected_output": "Hello World"}</code> (for print-based)
      </div>

      <div id="test-cases-container"></div>
      <button type="button" onclick="addTestCase()">+ Add Test Case</button>

      <button type="submit" class="btn">Create Exercise</button>
    </form>
  </main>

  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "login.html";

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function addTestCase() {
      const container = document.getElementById("test-cases-container");
      const div = document.createElement("div");
      div.className = "test-case-box";

      const textarea = document.createElement("textarea");
      textarea.rows = 4;
      textarea.placeholder = '{"input": [3, 5], "expected_output": 8}';
      textarea.className = "testcase-json";
      textarea.required = true;

      div.appendChild(textarea);
      container.appendChild(div);
    }

    // Load collections
    fetch("http://localhost:8000/api/collections/", {
      headers: { Authorization: `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
      const select = document.getElementById("collection-select");
      data.forEach(col => {
        const option = document.createElement("option");
        option.value = col.id;
        option.textContent = col.title;
        select.appendChild(option);
      });
    });

    // Submit logic
    document.getElementById("exercise-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const printBased = form.print_based.checked;

      const testCases = [];
      for (const textarea of document.querySelectorAll(".testcase-json")) {
        const value = textarea.value.trim();
        try {
          const obj = JSON.parse(value);
          if (!("input" in obj) || !("expected_output" in obj)) {
            alert("Each test case must have both 'input' and 'expected_output'");
            return;
          }
          testCases.push(obj);
        } catch (err) {
          alert(`Invalid JSON format:\n${err.message}`);
          return;
        }
      }

      const payload = {
        title: form.title.value,
        description: form.description.value,
        difficulty: form.difficulty.value,
        optimal_solution: form.optimal_solution.value,
        test_cases: testCases,
        print_based: printBased
      };

      const collectionId = form.collection.value;

      const res = await fetch("http://localhost:8000/api/exercises/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json();
        return alert("Error: " + JSON.stringify(err));
      }

      const created = await res.json();

      if (collectionId) {
        await fetch(`http://localhost:8000/api/exercises/${created.id}/add_to_collection/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ collection_id: collectionId })
        });
      }

      alert("Exercise created successfully!");
      window.location.href = "dashboard.html";
    });

    window.onload = () => {
      addTestCase();
    };
  </script>
</body>
</html>
