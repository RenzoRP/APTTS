<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Exercise - APTT</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 8px;
    }
    label {
      font-weight: bold;
    }
    input, select, textarea {
      padding: 0.5rem;
      border-radius: 4px;
      border: none;
      width: 100%;
    }
    textarea {
      resize: vertical;
    }
    .test-case-box {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .test-case-box input {
      flex: 1;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <img src="assets/APTT_Logo.png" alt="APTT Logo" class="logo" onclick="window.location.href='dashboard.html'">
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main class="container">
    <h2>Create New Exercise</h2>
    <form id="exercise-form">
      <label>Title</label>
      <input type="text" name="title" required>

      <label>Description</label>
      <textarea name="description" rows="4" required></textarea>

      <label>Difficulty</label>
      <select name="difficulty" required>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label>Collection</label>
      <select name="collection" id="collection-select">
        <option value="">-- None --</option>
      </select>

      <label>Print-based Evaluation</label>
      <input type="checkbox" name="print_based">

      <label>Optimal Solution (Python)</label>
      <textarea name="optimal_solution" rows="6" required></textarea>

      <label>Test Cases</label>
      <div id="test-cases-container"></div>
      <button type="button" onclick="addTestCase()">+ Add Test Case</button>

      <button type="submit" class="btn">Create Exercise</button>
    </form>
  </main>

  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "login.html";

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function addTestCase() {
      const container = document.getElementById("test-cases-container");
      const div = document.createElement("div");
      div.className = "test-case-box";
      div.innerHTML = `
        <input type="text" placeholder="Input" class="input-field" required>
        <input type="text" placeholder="Expected Output" class="output-field" required>
      `;
      container.appendChild(div);
    }

    // Load collections for selection
    fetch("http://localhost:8000/api/collections/", {
      headers: { Authorization: `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
      const select = document.getElementById("collection-select");
      data.forEach(col => {
        const option = document.createElement("option");
        option.value = col.id;
        option.textContent = col.title;
        select.appendChild(option);
      });
    });

    // Submit logic
    document.getElementById("exercise-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;

      const testCases = Array.from(document.querySelectorAll(".test-case-box")).map(tc => ({
        input: tc.querySelector(".input-field").value,
        expected_output: tc.querySelector(".output-field").value
      }));

      const payload = {
        title: form.title.value,
        description: form.description.value,
        difficulty: form.difficulty.value,
        optimal_solution: form.optimal_solution.value,
        test_cases: testCases,
        print_based: form.print_based.checked
      };

      const collectionId = form.collection.value;

      const res = await fetch("http://localhost:8000/api/exercises/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json();
        return alert("Error: " + JSON.stringify(err));
      }

      const created = await res.json();

      if (collectionId) {
        await fetch(`http://localhost:8000/api/exercises/${created.id}/add_to_collection/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ collection_id: collectionId })
        });
      }

      alert("Exercise created successfully!");
      window.location.href = "dashboard.html";
    });

    window.onload = () => {
      addTestCase();
    };
  </script>
</body>
</html>
