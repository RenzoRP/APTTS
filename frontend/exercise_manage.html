<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Exercise - APTT</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .edit-fields input, .edit-fields textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 4px;
    }

    .edit-btns {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }

    .insight {
      margin: 1rem 0;
      background: #1e293b;
      padding: 1rem;
      border-radius: 6px;
    }

    .insight h4 {
      cursor: pointer;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    .insight ul {
      list-style: none;
      margin: 0;
      padding-left: 1rem;
    }

    .insight li {
      margin-bottom: 0.3rem;
    }

    .danger {
      background-color: #dc2626;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .submission-list li {
      background-color: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 0.5rem;
      margin-bottom: 0.3rem;
      border-radius: 5px;
      font-family: monospace;
    }

    .submission-list a {
      color: #93c5fd;
      text-decoration: none;
    }

    .submission-list a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <img src="assets/APTT_Logo.png" class="logo" onclick="window.location.href='dashboard.html'" />
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main class="container">
    <div class="header-controls">
      <h2 id="exercise-title">Exercise Details</h2>
      <div>
        <button onclick="enableEdit()">✏️ Edit</button>
        <button class="danger" onclick="confirmDelete()">🗑 Delete</button>
      </div>
    </div>

    <div class="edit-fields">
      <label>Title</label>
      <input id="title" disabled>
      <label>Description</label>
      <textarea id="description" rows="3" disabled></textarea>
      <label>Test Cases (JSON)</label>
      <textarea id="test-cases" rows="4" disabled></textarea>
      <label>Optimal Solution</label>
      <textarea id="optimal" rows="4" disabled></textarea>
      <label>Start Hint</label>
      <textarea id="start-hint" rows="3" disabled></textarea>

      <div class="edit-btns" id="edit-controls" style="display:none">
        <button onclick="saveChanges()">💾 Save</button>
        <button onclick="window.location.reload()">Cancel</button>
      </div>
    </div>

    <div class="insight">
      <h4 onclick="toggleList('subs')">📊 Submissions (<span id="sub-count">0</span>) | ✅ <span id="sub-pass">0</span> | ❌ <span id="sub-fail">0</span></h4>
      <ul id="subs" class="submission-list" style="display:none"></ul>
    </div>

    <div class="insight">
      <h4 onclick="toggleList('feedbacks')">💡 Feedback Requests (<span id="fb-count">0</span>)</h4>
      <ul id="feedbacks" style="display:none"></ul>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("token");
    const exerciseId = new URLSearchParams(window.location.search).get("id");
    if (!token || !exerciseId) window.location.href = "dashboard.html";
    const headers = { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function toggleList(id) {
      const ul = document.getElementById(id);
      ul.style.display = ul.style.display === "none" ? "block" : "none";
    }

    function enableEdit() {
      ["title", "description", "test-cases", "optimal", "start-hint"].forEach(id => {
        document.getElementById(id).disabled = false;
      });
      document.getElementById("edit-controls").style.display = "flex";
    }

    function saveChanges() {
      fetch(`http://localhost:8000/api/exercises/${exerciseId}/`, {
        method: "PATCH",
        headers,
        body: JSON.stringify({
          title: document.getElementById("title").value,
          description: document.getElementById("description").value,
          test_cases: JSON.parse(document.getElementById("test-cases").value),
          optimal_solution: document.getElementById("optimal").value
        })
      }).then(() => window.location.reload());
    }

    function confirmDelete() {
      if (confirm("Are you sure you want to delete this exercise?")) {
        fetch(`http://localhost:8000/api/exercises/${exerciseId}/`, {
          method: "DELETE",
          headers
        }).then(() => window.location.href = "collection_manage.html");
      }
    }

    fetch(`http://localhost:8000/api/exercises/${exerciseId}/`, { headers })
      .then(res => res.json())
      .then(data => {
        document.getElementById("title").value = data.title;
        document.getElementById("description").value = data.description;
        document.getElementById("test-cases").value = JSON.stringify(data.test_cases, null, 2);
        document.getElementById("optimal").value = data.optimal_solution;

        fetch(`http://localhost:8000/api/feedback/?exercise=${exerciseId}&type=start_hint`, { headers })
          .then(r => r.json())
          .then(fb => {
            const hint = fb.length ? fb[0].content : "(No hint generated)";
            document.getElementById("start-hint").value = hint;
          });
      });

    fetch(`http://localhost:8000/api/submissions/?exercise=${exerciseId}`, { headers })
      .then(res => res.json())
      .then(subs => {
        document.getElementById("sub-count").textContent = subs.length;
        const ul = document.getElementById("subs");
        ul.innerHTML = "";
        let passCount = 0;
        let failCount = 0;

        subs.forEach(s => {
          if (s.score === 1.0) passCount++;
          else failCount++;

          const li = document.createElement("li");
          li.innerHTML = `
            <a href="submission.html?id=${s.id}">
              ${s.username} | ${s.score === 1.0 ? '✅ Passed' : '❌ Failed'} | ${new Date(s.timestamp).toLocaleString()}
            </a>`;
          ul.appendChild(li);
        });

        document.getElementById("sub-pass").textContent = passCount;
        document.getElementById("sub-fail").textContent = failCount;
      });

    fetch(`http://localhost:8000/api/feedback/?exercise=${exerciseId}`, { headers })
      .then(res => res.json())
      .then(fbs => {
        document.getElementById("fb-count").textContent = fbs.length;
        const ul = document.getElementById("feedbacks");
        ul.innerHTML = "";
        fbs.forEach(f => {
          const li = document.createElement("li");
          li.textContent = `${f.type} | ${new Date(f.generated_at).toLocaleString()}`;
          ul.appendChild(li);
        });
      });
  </script>
</body>
</html>
