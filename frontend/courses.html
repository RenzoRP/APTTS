<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Courses - APTT</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .container { max-width: 1200px; margin: 2rem auto; padding: 1rem; }
    .search-box { margin-bottom: 1rem; width: 100%; }
    .search-box input {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: none;
      background-color: #1e293b;
      color: white;
    }
    .layout { display: flex; gap: 2rem; }
    .column { flex: 1; padding: 0.5rem; }
    .card-container { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background-color: #1e293b;
      padding: 1rem;
      border-radius: 8px;
      width: 100%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .card h3 { margin-bottom: 0.5rem; }
    .card p { margin-bottom: 0.5rem; }
    .public-label {
      color: #22c55e;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .private-label {
      color: #facc15;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { background-color: #60cdfb; }
    .navbar .nav-links { display: flex; gap: 1rem; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">APTT</div>
    <div class="nav-links">
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container">
    <h2>Explore Courses</h2>
    <div class="search-box">
      <input type="text" placeholder="Search courses..." oninput="filterCourses(this.value)">
    </div>
    <div class="layout">
      <div class="column">
        <h3>Available Courses</h3>
        <div id="course-list" class="card-container"></div>
      </div>
      <div class="column">
        <h3>Your Courses</h3>
        <div id="enrolled-list" class="card-container"></div>
      </div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "login.html";

    let allCourses = [];
    let enrolledCourses = [];

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function renderCourses() {
      const query = document.querySelector(".search-box input").value.toLowerCase();
      const list = document.getElementById("course-list");
      list.innerHTML = "";

      const filtered = allCourses.filter(c =>
        (c.name.toLowerCase().includes(query) || c.description.toLowerCase().includes(query)) &&
        c.status === "not_enrolled"
      );

      if (filtered.length === 0) {
        list.innerHTML = "<p>No matching courses found.</p>";
        return;
      }

      filtered.forEach(course => {
        const card = document.createElement("div");
        card.className = "card";

        const label = course.public
          ? `<span class="public-label">Public</span>`
          : `<span class="private-label">Private</span>`;

        let button = "";
        if (course.status === "pending") {
          button = `<button class="btn" disabled>Pending Acceptance</button>`;
        } else if (course.status === "enrolled") {
          button = ``;
        } else {
          button = course.public
            ? `<button class="btn" onclick="enroll(${course.id})">Enroll</button>`
            : `<button class="btn" onclick="requestAccess(${course.id})">Request Access</button>`;
        }

        card.innerHTML = `
          <h3>${course.name}</h3>
          <p>${course.description}</p>
          ${label}
          <div style="margin-top: 0.5rem;">${button}</div>
        `;
        list.appendChild(card);
      });
    }

    function renderMyCourses() {
      const query = document.querySelector(".search-box input").value.toLowerCase();
      const container = document.getElementById("enrolled-list");
      container.innerHTML = "";

      const filtered = allCourses.filter(course =>
        (course.status === "enrolled" || course.status === "instructor") &&
        (course.name.toLowerCase().includes(query) || course.description.toLowerCase().includes(query))
      );

      filtered.forEach(course => {
        const div = document.createElement("div");
        div.className = "card";

        let content = `
          <h3>${course.name}</h3>
          <p>${course.description}</p>
        `;

        if (course.status === "instructor") {
          content += `<p><strong>You are the owner</strong></p>`;
          div.style.cursor = "pointer";
          div.onclick = () => window.location.href = `course_manage.html?id=${course.id}`;
        } else {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = "Unenroll";
          btn.onclick = (e) => {
            e.stopPropagation();
            if (confirm("Are you sure you want to unenroll? You will lose all progress in this course.")) {
              fetch(`http://localhost:8000/api/courses/${course.id}/remove_student/`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({ user_id: null })
              }).then(() => loadCourses());
            }
          };
          div.appendChild(btn);
          div.style.cursor = "pointer";
          div.onclick = () => window.location.href = `course.html?id=${course.id}`;
        }

        div.innerHTML += content;
        container.appendChild(div);
      });
    }


    function filterCourses() {
      renderCourses();
      renderMyCourses();
    }

    function enroll(courseId) {
      fetch(`http://localhost:8000/api/courses/${courseId}/enroll/`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        }
      }).then(res => {
        if (res.ok) {
          alert("Successfully enrolled!");
          loadCourses();
        } else {
          alert("Could not enroll in course.");
        }
      });
    }

    function requestAccess(courseId) {
      fetch(`http://localhost:8000/api/courses/${courseId}/request/`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        }
      }).then(res => {
        if (res.ok) {
          alert("Access request sent.");
          loadCourses();
        } else {
          alert("Could not send request.");
        }
      });
    }

    function loadCourses() {
      fetch("http://localhost:8000/api/courses/public/", {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        allCourses = data;
        renderCourses();
        renderMyCourses();
      });
    }

    loadCourses();
  </script>
</body>
</html>
